name: release

# Build cross-platform binaries and publish them to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            bin="exotherm"; [ "$os" = "windows" ] && bin="exotherm.exe"
            stage="exotherm_${VERSION}_${os}_${arch}"
            mkdir -p "stage/$stage"
            echo "Building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "stage/$stage/$bin" .
            cp README.md LICENSE "stage/$stage/"
            if [ "$os" = "windows" ]; then
              (cd stage && zip -qr "../dist/${stage}.zip" "$stage")
            else
              tar -czf "dist/${stage}.tar.gz" -C stage "$stage"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: exotherm-binaries
          path: dist/*
